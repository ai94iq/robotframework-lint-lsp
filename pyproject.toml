[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-lint"
version = "0.1.0"
description = "Robocop rule pack that follows the latest Robot Framework guidance"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "robotframework==7.5.1",
    "robotframework-robocop==9.4.0",
    "pygls==2.1.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
robotframework-lint-lsp = "robotframework_lint.lsp:main"

[project.entry-points."robocop.plugins"]
robotframework_lint = "robotframework_lint.rules"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.robocop.lint]
custom_rules = ["src/robotframework_lint/rules"]
