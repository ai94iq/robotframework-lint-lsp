[build-system]
requires = ["setuptools>=69,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-lint-lsp"
version = "1.1.0"
description = "Robot Framework lint for coding agents: robocop rules, an LSP server and an auto-fix hook"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Abdulwahab Isam" }]
keywords = ["robotframework", "robocop", "lint", "lsp", "claude-code"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Robot Framework",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "robotframework==7.5.1",
    "robotframework-robocop==9.4.0",
    "pygls==2.1.1",
]

[project.urls]
Homepage = "https://github.com/ai94iq/robotframework-lint-lsp"
Documentation = "https://github.com/ai94iq/robotframework-lint-lsp/blob/main/docs/agents.md"
Issues = "https://github.com/ai94iq/robotframework-lint-lsp/issues"

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
robotframework-lint-lsp = "robotframework_lint.lsp:main"
robotframework-lint-autofix = "robotframework_lint.autofix:main"

[project.entry-points."robocop.plugins"]
robotframework_lint = "robotframework_lint.rules"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.robocop.lint]
custom_rules = ["src/robotframework_lint/rules"]
